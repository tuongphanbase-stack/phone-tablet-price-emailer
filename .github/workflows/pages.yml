name: Deploy Pages
on:
  push:
    branches: [main]
  # Pushes made by a workflow do not start other workflows, so redeploy
  # after each price run to show the new data.
  workflow_run:
    workflows: ["Send phone & tablet prices"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
